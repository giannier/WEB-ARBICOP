# Runs the real PHP api (dist/) under Apache + mod_php for the Libro de Reclamaciones end-to-end test.
#   npm run build
#   docker compose -f docker-compose.libro-test.yml -p arbicop-libro up -d --build
#   node tools/libro-e2e.mjs            # see README ("Libro de Reclamaciones")
# dist/ is mounted read-only; each service gets its OWN storage volume, so dist/api/storage never gets runtime data.
# Mail is never sent: LR_MAIL_DRY_RUN=1 writes .eml files to storage/correo/.
# Failure injection (tests only, needs LR_MAIL_DRY_RUN + LR_TEST_LIMITS): LR_TEST_FAIL=archive|pdf|smtp-company|smtp-consumer,
# or the same word in storage/.test-fail (the e2e toggles that file between requests). See src/public/api/README.md.
name: arbicop-libro
x-libro: &libro
  environment:
    LR_MAIL_DRY_RUN: "1"
    # relaxed limits (honoured only with dry-run): no per-IP interval, short fill time
    LR_TEST_LIMITS: '{"interval_seconds":0,"per_day":1000,"global_per_hour":1000,"global_per_day":1000,"min_fill_seconds":2}'
services:
  libro-php84:            # newest PHP supported (cPanel EA-PHP 8.4)
    <<: *libro
    build: { context: ./docker/libro-test, args: { PHP_VERSION: "8.4" } }
    ports: ["8085:80"]
    volumes:
      - ./dist:/var/www/html:ro
      - storage84:/var/www/html/api/storage
  libro-php81:            # oldest supported
    <<: *libro
    build: { context: ./docker/libro-test, args: { PHP_VERSION: "8.1" } }
    ports: ["8086:80"]
    volumes:
      - ./dist:/var/www/html:ro
      - storage81:/var/www/html/api/storage
  libro-strict:           # production limits (1 claim / IP / 30 min, min fill 6 s) to prove the rate limiter
    build: { context: ./docker/libro-test, args: { PHP_VERSION: "8.1" } }
    environment:
      LR_MAIL_DRY_RUN: "1"
    ports: ["8087:80"]
    volumes:
      - ./dist:/var/www/html:ro
      - storagestrict:/var/www/html/api/storage
  libro-fail:             # failure injection + a REAL per-IP slot (interval 30 min, 1/day) to prove the reservation is released
    build: { context: ./docker/libro-test, args: { PHP_VERSION: "8.1" } }
    environment:
      LR_MAIL_DRY_RUN: "1"
      LR_TEST_LIMITS: '{"interval_seconds":1800,"per_day":1,"global_per_hour":1000,"global_per_day":1000,"min_fill_seconds":2}'
    ports: ["8088:80"]
    volumes:
      - ./dist:/var/www/html:ro
      - storagefail:/var/www/html/api/storage
volumes:
  storage84:
  storage81:
  storagestrict:
  storagefail:
