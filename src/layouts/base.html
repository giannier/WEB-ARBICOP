<!doctype html>
<html lang="es-PE">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
	<title>{{title}}</title>
	<meta name="description" content="{{description}}">
	<meta name="robots" content="{{robots}}">
	<link rel="canonical" href="{{canonical}}">
	<link rel="icon" href="/favicon.ico" sizes="any">
	<link rel="icon" href="/assets/images/uploads/2026/06/cropped-LOGO-ARBICOP-32x32.png" sizes="32x32">
	<link rel="icon" href="/assets/images/uploads/2026/06/cropped-LOGO-ARBICOP-192x192.png" sizes="192x192">
	<link rel="apple-touch-icon" href="/assets/images/uploads/2026/06/cropped-LOGO-ARBICOP-180x180.png">
	<meta name="msapplication-TileImage" content="/assets/images/uploads/2026/06/cropped-LOGO-ARBICOP-270x270.png">
	<meta property="og:locale" content="es_PE">
	<meta property="og:type" content="{{og_type}}">
	<meta property="og:site_name" content="{{site.name}}">
	<meta property="og:title" content="{{title}}">
	<meta property="og:description" content="{{description}}">
	<meta property="og:url" content="{{canonical}}">
	<meta property="og:image" content="{{og_image_url}}">
	<meta property="og:image:type" content="image/jpeg">
	<meta property="og:image:width" content="1200">
	<meta property="og:image:height" content="630">
	<meta property="og:image:alt" content="{{site.og_image_alt}}">
	<meta name="twitter:card" content="summary_large_image">
	<meta name="twitter:title" content="{{title}}">
	<meta name="twitter:description" content="{{description}}">
	<meta name="twitter:image" content="{{og_image_url}}">
	<meta name="twitter:image:alt" content="{{site.og_image_alt}}">
	<script type="application/ld+json">
	{
		"@context": "https://schema.org",
		"@type": "EducationalOrganization",
		"name": "{{site.name}}",
		"legalName": "{{site.legal_name}}",
		"url": "{{site.url}}/",
		"logo": "{{site.url}}/assets/images/uploads/2026/06/cropped-LOGO-ARBICOP.png",
		"image": "{{og_image_url}}",
		"telephone": "{{site.phone}}",
		"email": "{{site.email}}",
		"address": [
			{
				"@type": "PostalAddress",
				"streetAddress": "Jr. Ayacucho 1326",
				"addressLocality": "Chachapoyas",
				"addressRegion": "Amazonas",
				"addressCountry": "PE"
			},
			{
				"@type": "PostalAddress",
				"streetAddress": "Av. República de Chile 324, Of. 601",
				"addressLocality": "Jesús María",
				"addressRegion": "Lima",
				"addressCountry": "PE"
			},
			{
				"@type": "PostalAddress",
				"streetAddress": "Calle Alfredo La Point 1221",
				"addressLocality": "Chiclayo",
				"addressRegion": "Lambayeque",
				"addressCountry": "PE"
			}
		],
		"sameAs": [
			"https://www.facebook.com/somosinstitutoarbicop",
			"https://www.instagram.com/somosinstitutoarbicop/",
			"https://www.tiktok.com/@somosinstitutoarbicop",
			"https://www.youtube.com/@somosinstitutoarbicop"
		]
	}
	</script>
{{include head-pre}}
{{head}}
{{include head-post}}
	<link rel="stylesheet" href="/assets/css/custom.css">
	<link rel="stylesheet" href="/assets/css/whatsapp.css">
</head>
<body class="{{body_class}}">
{{before_header}}
{{wrap_open}}
{{header}}
{{content}}
{{footer}}
{{after_footer}}
{{wrap_close}}
{{include whatsapp}}
{{include scripts-pre}}
{{scripts}}
{{include scripts-post}}
<script src="/assets/js/forms.js" data-whatsapp="{{site.whatsapp}}"></script>
</body>
</html>
